name: Refresh Threads Token

on:
  schedule:
    - cron: "0 0 * * 1"  # 毎週月曜 0:00 UTC (9:00 JST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Refresh THREADS_ACCESS_TOKEN
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/refresh_threads_token.py

      - name: Keep repository active
        # GitHubはリポジトリへのpushが60日間ないと、スケジュール実行のワークフローを
        # 自動的に無効化してしまう。このリポジトリはコード変更がほとんど発生しないため、
        # 毎週このコミットを作ることでpushを発生させ、自動無効化を防ぐ。
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/KEEPALIVE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/KEEPALIVE
          if ! git diff --cached --quiet; then
            git commit -m "chore: リポジトリを活動中に保つ(自動無効化防止)"
            git push
          fi
